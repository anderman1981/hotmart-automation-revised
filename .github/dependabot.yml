version: 2
updates:
  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "andersonmartinezrestrepo"
    assignees:
      - "andersonmartinezrestrepo"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"

  # Motor service
  - package-ecosystem: "npm"
    directory: "/motor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "andersonmartinezrestrepo"
    assignees:
      - "andersonmartinezrestrepo"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "motor"

  # Dashboard
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "andersonmartinezrestrepo"
    assignees:
      - "andersonmartinezrestrepo"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "dashboard"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    reviewers:
      - "andersonmartinezrestrepo"
    assignees:
      - "andersonmartinezrestrepo"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "1"
      time: "09:00"
    reviewers:
      - "andersonmartinezrestrepo"
    assignees:
      - "andersonmartinezrestrepo"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"