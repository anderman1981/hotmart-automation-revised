name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM

jobs:
  # Snyk Vulnerability Scan
  snyk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd motor && npm ci
          cd ../dashboard && npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

      - name: Run Snyk to monitor
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --monitor

  # CodeQL Analysis
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [ 'javascript' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  # OWASP ZAP Baseline Scan
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services for scanning
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:4123'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Cleanup
        run: |
          docker-compose -f docker-compose.test.yml down -v

  # npm Audit
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Audit root dependencies
        run: |
          npm ci
          npm audit --audit-level=moderate || true

      - name: Audit motor dependencies
        run: |
          cd motor
          npm ci
          npm audit --audit-level=moderate || true

      - name: Audit dashboard dependencies
        run: |
          cd dashboard
          npm ci
          npm audit --audit-level=moderate || true

  # Docker Security Scan
  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t hotmart-motor ./motor
          docker build -t hotmart-dashboard ./dashboard

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hotmart-motor'
          format: 'sarif'
          output: 'trivy-results-motor.sarif'

      - name: Run Trivy vulnerability scanner for dashboard
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hotmart-dashboard'
          format: 'sarif'
          output: 'trivy-results-dashboard.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results-motor.sarif'

      - name: Upload Trivy scan results to GitHub Security tab (dashboard)
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results-dashboard.sarif'

  # Secrets Scan
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # Notify on security issues
  notify-security:
    runs-on: ubuntu-latest
    needs: [snyk, codeql, zap, npm-audit, docker-scan, secrets-scan]
    if: failure()
    steps:
      - name: Notify security issues
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#security'
          text: |
            Security scan detected issues in ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            Please review the security scan results.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}