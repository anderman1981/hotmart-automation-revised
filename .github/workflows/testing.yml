name: Testing Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_hotmart
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies (motor)
      run: |
        cd motor
        npm ci
    
    - name: Install dependencies (dashboard)
      run: |
        cd dashboard
        npm ci
    
    - name: Install dependencies (tests)
      run: |
        cd tests
        npm ci
    
    - name: Wait for services
      run: |
        sleep 10
        # Test database connection
        PGPASSWORD=test_password psql -h localhost -U test_user -d test_hotmart -c "SELECT 1;"
        # Test Redis connection
        redis-cli -h localhost ping
    
    - name: Run unit tests (motor)
      run: |
        cd motor
        npm run test:coverage
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: test_hotmart
        REDIS_HOST: localhost
        NODE_ENV: test
    
    - name: Run unit tests (dashboard)
      run: |
        cd dashboard
        npm run test:coverage
      env:
        NODE_ENV: test
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./motor/coverage/lcov.info,./dashboard/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_hotmart
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd motor && npm ci
        cd ../tests && npm ci
    
    - name: Wait for services
      run: sleep 10
    
    - name: Run integration tests
      run: |
        cd tests
        npm run test:integration
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: test_hotmart
        REDIS_HOST: localhost
        NODE_ENV: test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd motor && npm ci
        cd ../dashboard && npm ci
        cd ../tests && npm ci
        npm install -g @playwright/test
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Start services
      run: |
        # Start motor server in background
        cd motor
        npm run dev &
        MOTOR_PID=$!
        
        # Start dashboard in background
        cd ../dashboard
        npm run dev &
        DASHBOARD_PID=$!
        
        # Wait for services to start
        sleep 30
        
        # Save PIDs for cleanup
        echo "MOTOR_PID=$MOTOR_PID" >> $GITHUB_ENV
        echo "DASHBOARD_PID=$DASHBOARD_PID" >> $GITHUB_ENV
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: test_hotmart
        REDIS_HOST: localhost
        NODE_ENV: test
    
    - name: Run E2E tests
      run: |
        cd tests
        npm run test:e2e
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: tests/playwright-report/
        retention-days: 7
    
    - name: Cleanup services
      if: always()
      run: |
        kill $MOTOR_PID || true
        kill $DASHBOARD_PID || true

  security-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd motor && npm ci
    
    - name: Run security audit
      run: |
        cd motor
        npm run security:audit
    
    - name: Run security tests
      run: |
        cd motor
        npm run security:test

  coverage-check:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Download coverage reports
      uses: actions/download-artifact@v3
      with:
        name: coverage-reports
    
    - name: Check coverage thresholds
      run: |
        # Check if coverage meets minimum thresholds
        if [ ! -f "motor/coverage/coverage-summary.json" ]; then
          echo "Motor coverage report not found"
          exit 1
        fi
        
        # Extract coverage values
        MOTOR_LINES=$(cat motor/coverage/coverage-summary.json | jq '.total.lines.pct')
        MOTOR_FUNCTIONS=$(cat motor/coverage/coverage-summary.json | jq '.total.functions.pct')
        MOTOR_BRANCHES=$(cat motor/coverage/coverage-summary.json | jq '.total.branches.pct')
        MOTOR_STATEMENTS=$(cat motor/coverage/coverage-summary.json | jq '.total.statements.pct')
        
        # Check thresholds
        THRESHOLD=80
        
        if (( $(echo "$MOTOR_LINES < $THRESHOLD" | bc -l) )); then
          echo "Motor lines coverage $MOTOR_LINES% is below threshold $THRESHOLD%"
          exit 1
        fi
        
        if (( $(echo "$MOTOR_FUNCTIONS < $THRESHOLD" | bc -l) )); then
          echo "Motor functions coverage $MOTOR_FUNCTIONS% is below threshold $THRESHOLD%"
          exit 1
        fi
        
        if (( $(echo "$MOTOR_BRANCHES < $THRESHOLD" | bc -l) )); then
          echo "Motor branches coverage $MOTOR_BRANCHES% is below threshold $THRESHOLD%"
          exit 1
        fi
        
        if (( $(echo "$MOTOR_STATEMENTS < $THRESHOLD" | bc -l) )); then
          echo "Motor statements coverage $MOTOR_STATEMENTS% is below threshold $THRESHOLD%"
          exit 1
        fi
        
        echo "✅ All coverage thresholds met!"